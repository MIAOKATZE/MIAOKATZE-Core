def coreMuiVersion = providers.gradleProperty("coreMuiVersion").getOrElse("2.3.97-1.7.10")
def coreLibVersion = providers.gradleProperty("coreLibVersion").getOrElse("0.11.58")
def coreAngelicaVersion = providers.gradleProperty("coreAngelicaVersion").getOrElse("2.2.46")

// Never extend the production graph with an older platform. Each task receives one complete API set.
def compatibilityPins = [
    '290': ['5.09.54.265', '3.8.92-GTNH', '2.3.94-1.7.10', '0.11.54', '2.8.171-GTNH', '2.2.43', '1.0.36-GTNH'],
    '291': ['5.09.54.275', '3.8.94-GTNH', '2.3.96-1.7.10', '0.11.58', '2.8.175-GTNH', '2.2.46', '1.0.38-GTNH'],
    '292': ['5.09.54.277', '3.8.94-GTNH', '2.3.97-1.7.10', '0.11.58', '2.8.176-GTNH', '2.2.46', '1.0.38-GTNH']
]
compatibilityPins.each { platform, pins ->
    def graph = configurations.create("gtnh${platform}Api") {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    ['GT5-Unofficial', 'BetterQuesting', 'ModularUI2', 'GTNHLib', 'NotEnoughItems', 'Angelica', 'ChromaticTooltips'].eachWithIndex { mod, i ->
        def group = mod == 'ChromaticTooltips' ? 'com.github.slprime' : 'com.github.GTNewHorizons'
        dependencies.add(graph.name, "${group}:${mod}:${pins[i]}:dev")
    }
    tasks.register("runGtnh${platform}Contracts", JavaExec) {
        group = 'verification'
        description = "Checks modern production linkage against the isolated GTNH ${platform} API graph; no game or GL."
        mainClass = 'com.miaokatze.miaokatzecore.compat.PlatformLinkageContracts'
        classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
        inputs.files(graph, sourceSets.main.output.classesDirs)
        args(platform, sourceSets.main.output.classesDirs.asPath, graph.asPath)
    }
}

dependencies {
    // Platform fixtures inspect recent dependency bytecode without loading or initializing it.
    testImplementation("org.ow2.asm:asm-tree:9.9") { transitive = true }
    // GTNH 2.9.2 production graph. Older graphs are isolated verification configurations below.
    compileOnly("com.github.GTNewHorizons:BetterQuesting:3.8.94-GTNH:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.277:dev") { transitive = false }
    // Optional client fixes for the native world hologram renderer.
    compileOnly("com.github.GTNewHorizons:StructureLib:1.4.47:dev") { transitive = false }
    // Angelica's client line-geometry types use JOML. The renderer never bundles it.
    compileOnly("org.joml:joml:1.10.8") { transitive = false }
    // Pure JVM shader-generation contracts load the native VertexKey without an OpenGL context.
    testRuntimeOnly("org.joml:joml:1.10.8") { transitive = false }
    compileOnly("com.github.GTNewHorizons:ModularUI2:${coreMuiVersion}:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:GTNHLib:${coreLibVersion}:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:Controlling:2.1.10:dev") { transitive = false }
    compileOnly("com.github.slprime:ChromaticTooltips:1.0.38-GTNH:dev") { transitive = false }
    // Optional client-only ordering adapter. Never bundled or required at runtime.
    compileOnly("com.github.GTNewHorizons:NotEnoughItems:2.8.176-GTNH:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:Angelica:${coreAngelicaVersion}:dev") { transitive = false }
    // The native rebuild submission set is a fastutil ReferenceSet.
    compileOnly("it.unimi.dsi:fastutil:8.5.18") { transitive = false }
    // Angelica's Java 8 dev API contains downgraded record signatures.
    compileOnly("xyz.wagyourtail.jvmdowngrader:jvmdowngrader-java-api:1.3.5:downgraded-8") { transitive = false }
}
