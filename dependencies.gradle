def coreMuiVersion = providers.gradleProperty("coreMuiVersion").getOrElse("2.3.92-1.7.10")
def coreLibVersion = providers.gradleProperty("coreLibVersion").getOrElse("0.11.52")
def coreAngelicaVersion = providers.gradleProperty("coreAngelicaVersion").getOrElse("2.2.28")

dependencies {
    // Minimal common recipe-cache bridge for the GTNH 2.9 RC baseline. Never bundled.
    compileOnly("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.205:dev") { transitive = false }
    // Pure JVM shader-generation contracts load the native VertexKey without an OpenGL context.
    testRuntimeOnly("org.joml:joml:1.10.8") { transitive = false }
    compileOnly("com.github.GTNewHorizons:ModularUI2:${coreMuiVersion}:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:GTNHLib:${coreLibVersion}:dev") { transitive = false }
    // Optional client-only ordering adapter, matching GTNH 2.9 RC2. Never bundled or required at runtime.
    compileOnly("com.github.GTNewHorizons:NotEnoughItems:2.8.145-GTNH:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:Angelica:${coreAngelicaVersion}:dev") { transitive = false }
    // RC2's native rebuild submission set is a fastutil ReferenceSet.
    compileOnly("it.unimi.dsi:fastutil:8.5.18") { transitive = false }
    // RC2 Angelica's Java 8 dev API contains downgraded record signatures.
    compileOnly("xyz.wagyourtail.jvmdowngrader:jvmdowngrader-java-api:1.3.5:downgraded-8") { transitive = false }
}
