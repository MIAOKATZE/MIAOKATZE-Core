def coreMuiVersion = providers.gradleProperty("coreMuiVersion").getOrElse("2.3.94-1.7.10")
def coreLibVersion = providers.gradleProperty("coreLibVersion").getOrElse("0.11.54")
def coreAngelicaVersion = providers.gradleProperty("coreAngelicaVersion").getOrElse("2.2.42")

dependencies {
    // Minimal common recipe-cache bridge for GTNH 2.9.0. Never bundled.
    compileOnly("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.264:dev") { transitive = false }
    // Pure JVM shader-generation contracts load the native VertexKey without an OpenGL context.
    testRuntimeOnly("org.joml:joml:1.10.8") { transitive = false }
    compileOnly("com.github.GTNewHorizons:ModularUI2:${coreMuiVersion}:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:GTNHLib:${coreLibVersion}:dev") { transitive = false }
    // Optional client-only ordering adapter, matching GTNH 2.9.0. Never bundled or required at runtime.
    compileOnly("com.github.GTNewHorizons:NotEnoughItems:2.8.171-GTNH:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:Angelica:${coreAngelicaVersion}:dev") { transitive = false }
    // The native rebuild submission set is a fastutil ReferenceSet.
    compileOnly("it.unimi.dsi:fastutil:8.5.18") { transitive = false }
    // Angelica's Java 8 dev API contains downgraded record signatures.
    compileOnly("xyz.wagyourtail.jvmdowngrader:jvmdowngrader-java-api:1.3.5:downgraded-8") { transitive = false }
}
